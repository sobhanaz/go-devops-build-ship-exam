apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: snaplink
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate # never two Redis pods at the same time
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Kubernetes expands $(REDIS_PASSWORD) from the env below at start-up.
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snaplink-redis
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Trade-off: emptyDir survives container restarts but NOT pod
        # rescheduling (links are lost). Fine for the exam; for real data use a
        # StatefulSet with a PersistentVolumeClaim.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: snaplink
  labels:
    app: redis
spec:
  type: ClusterIP # internal only
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
