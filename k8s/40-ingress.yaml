# Bonus B2: expose SnapLink as http://snaplink.local through ingress-nginx.
# kind needs ingress-nginx installed first:
#   kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml
# then add "127.0.0.1 snaplink.local" to /etc/hosts and set BASE_URL in
# 10-configmap.yaml to http://snaplink.local so short_url matches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snaplink
  namespace: snaplink
spec:
  ingressClassName: nginx
  rules:
    - host: snaplink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snaplink
                port:
                  name: http
