apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minibank.fullname" . }}-secret
  labels:
    {{- include "minibank.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "minibank.databaseURL" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
