# Secrets: the database password and the full connection string.
# DEMO VALUES for a local kind/minikube cluster only. In a real cluster this
# file is not committed; create the Secret out of band instead, e.g.
#   kubectl -n minibank create secret generic minibank-secret \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=DATABASE_URL=...
# (or use sealed-secrets / external-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: minibank-secret
  namespace: minibank
type: Opaque
stringData:
  POSTGRES_PASSWORD: "minibank-dev-password"
  DATABASE_URL: "postgres://minibank:minibank-dev-password@postgres:5432/minibank?sslmode=disable"
