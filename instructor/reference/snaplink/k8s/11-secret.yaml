# The Redis password, used by BOTH the redis Deployment (--requirepass) and
# the app (REDIS_PASSWORD via secretKeyRef).
#
# Note: a Secret is only base64-ENCODED, not encrypted. Anyone who can
# `kubectl get secret -o yaml` can read it. Committing this value is OK for a
# local kind cluster only; for real clusters create it out of band:
#   kubectl -n snaplink create secret generic snaplink-redis --from-literal=REDIS_PASSWORD=...
# or use Sealed Secrets / External Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: snaplink-redis
  namespace: snaplink
type: Opaque
stringData:
  REDIS_PASSWORD: kind-only-change-me
