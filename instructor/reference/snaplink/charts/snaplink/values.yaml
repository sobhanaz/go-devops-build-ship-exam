# Default values for the snaplink chart.
#   helm install snaplink charts/snaplink -n snaplink --create-namespace \
#     --set redis.password="$(openssl rand -hex 16)"

replicaCount: 2

image:
  repository: snaplink
  tag: v1 # pinned, never "latest"
  pullPolicy: IfNotPresent # image loaded with `kind load docker-image snaplink:v1`

service:
  port: 80

config:
  port: 8080
  # short_url prefix; matches `kubectl port-forward svc/snaplink 8080:80`.
  baseURL: http://localhost:8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

redis:
  image: redis:7-alpine
  # Override at install time (--set redis.password=...). Stored in a Secret,
  # which is base64-encoded, NOT encrypted.
  password: kind-only-change-me
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: false
  className: nginx
  host: snaplink.local
