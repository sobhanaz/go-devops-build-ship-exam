apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snaplink.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snaplink.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "snaplink.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "snaplink.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # Changing the config or the password rolls the pods automatically.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: snaplink
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          envFrom:
            - configMapRef:
                name: {{ include "snaplink.fullname" . }}-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "snaplink.fullname" . }}-redis
                  key: REDIS_PASSWORD
          livenessProbe: # never touches Redis
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe: # pings Redis, 503 when it is down
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3 # /readyz may wait up to 2 s for the Redis PING
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
