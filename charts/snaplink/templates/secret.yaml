apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snaplink.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snaplink.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_PASSWORD: {{ required "redis.password is required" .Values.redis.password | b64enc | quote }}
